<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>L.B ONLINE | 패치 노트</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
  <link rel="stylesheet" href="/assets/site.css" />
  <script defer src="/assets/site.js"></script>
</head>
<body data-page="patch">
  <nav class="nav glass">
    <div class="nav-inner">
      <a class="brand" href="/"><img class="brand-icon" src="/assets/libang-icon.png" alt="L.B 아이콘" /><span class="editable single-line" data-copy-key="brand">L.B ONLINE</span></a>
      <div class="nav-right">
        <div class="nav-links">
          <a href="/" data-page-link="home"><span class="editable single-line" data-copy-key="nav-home">Home</span></a>
          <a href="/servers/" data-page-link="servers"><span class="editable single-line" data-copy-key="nav-servers">Servers</span></a>
          <a href="/support/" data-page-link="support"><span class="editable single-line" data-copy-key="nav-support">Support</span></a>
          <a href="/patch/" data-page-link="patch"><span class="editable single-line" data-copy-key="nav-patches">Patches</span></a>
          <a href="/team/" data-page-link="team"><span class="editable single-line" data-copy-key="nav-team">Team</span></a>
        </div>
        <div class="admin-controls admin-only">
          <button class="mini-btn primary edit-start-only" type="button" data-action="start-editing">편집</button>
          <button class="mini-btn primary edit-mode-only" type="button" data-action="save-edits">저장</button>
          <button class="mini-btn ghost edit-mode-only" type="button" data-action="cancel-edits">취소</button>
          <span class="status" id="editStatus"></span>
        </div>
        <div class="nav-icons">
          <a class="icon-btn" href="https://github.com/kkaemok/libang-website" target="_blank" rel="noopener noreferrer" aria-label="GitHub"><i class="fa-brands fa-github"></i></a>
          <a class="icon-btn" href="https://discord.gg/yQsTjAJBne" target="_blank" rel="noopener noreferrer" aria-label="Discord"><i class="fa-brands fa-discord"></i></a>
          <a class="icon-btn" id="authLink" href="/auth/" aria-label="로그인/회원가입"><i class="fa-solid fa-circle-user"></i></a>
          <button class="menu-btn" type="button" data-action="toggle-menu" aria-label="메뉴 열기"><i class="fa-solid fa-bars"></i></button>
        </div>
      </div>
    </div>
  </nav>

  <main class="container page-main">
    <header class="page-hero">
      <span class="eyebrow"><i class="fa-solid fa-code-branch"></i><span class="editable single-line" data-copy-key="patch-eyebrow">Patch Notes</span></span>
      <h1 class="editable" data-copy-key="patch-page-title">패치 노트</h1>
      <p class="page-copy editable" data-copy-key="patch-page-desc">서버 업데이트, 긴급 수정, 신규 기능을 시간순으로 공유합니다.</p>
    </header>

    <section class="section-block">
      <div class="section-head">
        <div>
          <h2 class="editable single-line" data-copy-key="patch-title">업데이트 내역</h2>
          <p class="section-copy editable" data-copy-key="patch-desc">변경 사항을 간결하게 정리합니다.</p>
        </div>
        <div class="toolbar admin-only edit-mode-only">
          <button class="mini-btn" type="button" data-action="add-patch"><i class="fa-solid fa-plus"></i>패치 추가</button>
          <button class="mini-btn ghost" type="button" data-action="reset-patch">초기화</button>
        </div>
      </div>
      <div class="update-list" id="updateList"></div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <span class="editable single-line" data-copy-key="footer">L.B ONLINE © 2026</span>
      <span class="editable single-line" data-copy-key="footer-sub">Built for Minecraft servers.</span>
    </div>
  </footer>
</body>
</html>
