<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>L.B ONLINE | 결제 취소</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Sora:wght@600;700&display=swap');
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@1.3.9/dist/web/pretendard.css');
    :root {
      --bg: #0b0d11;
      --card: #131922;
      --border: rgba(255, 255, 255, 0.08);
      --text: #eef2f6;
      --muted: #a6b0be;
      --danger: #ffb3b3;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: "Pretendard", "Apple SD Gothic Neo", sans-serif;
      background: radial-gradient(680px 440px at 50% 10%, rgba(255, 120, 120, 0.11), transparent 68%), var(--bg);
      color: var(--text);
    }
    .card {
      width: min(500px, 100%);
      padding: clamp(24px, 7vw, 36px);
      border-radius: 22px;
      border: 1px solid var(--border);
      background: var(--card);
      text-align: center;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    }
    .icon {
      width: 54px;
      height: 54px;
      display: grid;
      place-items: center;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: rgba(255, 120, 120, 0.14);
      color: var(--danger);
      font-size: 1.45rem;
      font-weight: 700;
    }
    h1 {
      font-family: "Sora", "Pretendard", sans-serif;
      margin: 0 0 10px;
      font-size: clamp(1.42rem, 6vw, 1.7rem);
    }
    .description { color: var(--muted); margin: 0 0 22px; word-break: keep-all; }
    .code {
      display: none;
      margin: 0 0 22px;
      padding: 12px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.035);
      color: var(--muted);
      font-size: 0.86rem;
    }
    .code.visible { display: block; }
    .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .btn {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      min-height: 46px;
      padding: 11px 19px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--text);
      font-weight: 700;
      text-decoration: none;
    }
    .btn.primary {
      color: #031012;
      border: none;
      background: linear-gradient(135deg, #2fd6c9, #34a9ff);
    }
    @media (max-width: 480px) {
      .actions .btn { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">!</div>
    <h1>결제가 완료되지 않았습니다</h1>
    <p class="description" id="failureMessage">결제가 취소되었거나 인증에 실패했습니다. 다시 시도할 수 있습니다.</p>
    <p class="code" id="failureCode"></p>
    <div class="actions">
      <a class="btn primary" href="/#support">다시 결제하기</a>
      <a class="btn" href="/">홈으로 이동</a>
    </div>
  </main>
  <script>
    const query = new URLSearchParams(window.location.search);
    const message = query.get("message");
    const code = query.get("code");
    const messageElement = document.getElementById("failureMessage");
    const codeElement = document.getElementById("failureCode");

    if (message) {
      messageElement.textContent = message;
    }
    if (code) {
      codeElement.textContent = `오류 코드: ${code}`;
      codeElement.classList.add("visible");
    }
  </script>
</body>
</html>
