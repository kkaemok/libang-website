<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>L.B ONLINE | 결제 승인</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Sora:wght@600;700&display=swap');
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@1.3.9/dist/web/pretendard.css');
    :root {
      --bg: #0b0d11;
      --card: #131922;
      --border: rgba(255, 255, 255, 0.08);
      --text: #eef2f6;
      --muted: #a6b0be;
      --accent: #2fd6c9;
      --danger: #ffb3b3;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: "Pretendard", "Apple SD Gothic Neo", sans-serif;
      background: radial-gradient(680px 440px at 50% 10%, rgba(47, 214, 201, 0.14), transparent 68%), var(--bg);
      color: var(--text);
    }
    .card {
      width: min(500px, 100%);
      padding: clamp(24px, 7vw, 36px);
      border-radius: 22px;
      border: 1px solid var(--border);
      background: var(--card);
      text-align: center;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    }
    .icon {
      width: 54px;
      height: 54px;
      display: grid;
      place-items: center;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: rgba(47, 214, 201, 0.13);
      color: var(--accent);
      font-size: 1.45rem;
      font-weight: 700;
    }
    .icon.processing { animation: pulse 1.2s infinite ease-in-out; }
    .icon.error { background: rgba(255, 120, 120, 0.14); color: var(--danger); animation: none; }
    @keyframes pulse { 50% { transform: scale(1.08); opacity: 0.7; } }
    h1 {
      font-family: "Sora", "Pretendard", sans-serif;
      margin: 0 0 10px;
      font-size: clamp(1.42rem, 6vw, 1.7rem);
    }
    .description { color: var(--muted); margin: 0 0 22px; }
    .details {
      display: none;
      text-align: left;
      padding: 16px;
      margin: 0 0 22px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.035);
    }
    .details.visible { display: grid; gap: 9px; }
    .row { display: flex; justify-content: space-between; gap: 12px; font-size: 0.94rem; }
    .row span:first-child { color: var(--muted); }
    .row strong { text-align: right; }
    .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .btn {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      min-height: 46px;
      padding: 11px 19px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--text);
      font-weight: 700;
      text-decoration: none;
    }
    .btn.primary {
      color: #031012;
      border: none;
      background: linear-gradient(135deg, #2fd6c9, #34a9ff);
    }
    @media (max-width: 480px) {
      .actions .btn { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon processing" id="resultIcon">...</div>
    <h1 id="resultTitle">결제를 승인하고 있습니다</h1>
    <p class="description" id="resultMessage">잠시만 기다려주세요. 창을 닫지 마세요.</p>
    <div class="details" id="paymentDetails">
      <div class="row"><span>상품</span><strong id="orderName"></strong></div>
      <div class="row"><span>결제 금액</span><strong id="amount"></strong></div>
      <div class="row"><span>결제수단</span><strong id="method"></strong></div>
    </div>
    <div class="actions">
      <a class="btn primary" href="/#support">후원 페이지로 돌아가기</a>
      <a class="btn" href="/">홈으로 이동</a>
    </div>
  </main>
  <script>
    const icon = document.getElementById("resultIcon");
    const title = document.getElementById("resultTitle");
    const message = document.getElementById("resultMessage");
    const details = document.getElementById("paymentDetails");
    const query = new URLSearchParams(window.location.search);
    const paymentKey = query.get("paymentKey");
    const orderId = query.get("orderId");
    const amount = Number(query.get("amount"));

    function showFailure(text) {
      icon.textContent = "!";
      icon.className = "icon error";
      title.textContent = "결제 승인을 완료하지 못했습니다";
      message.textContent = text;
    }

    async function confirmPayment() {
      if (!paymentKey || !orderId || !Number.isSafeInteger(amount) || amount < 1) {
        showFailure("결제 인증 정보가 올바르지 않습니다. 결제 페이지에서 다시 시도해주세요.");
        return;
      }

      try {
        const response = await fetch("/api/payments/confirm", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ paymentKey, orderId, amount })
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok || !data.payment) {
          throw new Error(data.code || "APPROVAL_FAILED");
        }

        icon.textContent = "OK";
        icon.className = "icon";
        title.textContent = "결제가 완료되었습니다";
        message.textContent = data.alreadyApproved ? "이미 승인된 결제 내역입니다." : "후원에 참여해주셔서 감사합니다.";
        document.getElementById("orderName").textContent = data.payment.orderName;
        document.getElementById("amount").textContent = `${data.payment.amount.toLocaleString("ko-KR")}원`;
        document.getElementById("method").textContent = data.payment.method || "간편결제";
        details.classList.add("visible");
      } catch {
        showFailure("승인 처리 중 문제가 발생했습니다. 주문번호를 보관하고 운영진에게 문의해주세요.");
      }
    }

    confirmPayment();
  </script>
</body>
</html>
