<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>L.B ONLINE | 로그인</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
  <link rel="stylesheet" href="/assets/site.css" />
</head>
<body class="auth-page">
  <main class="auth-card glass">
    <a class="brand" href="/">
      <img class="brand-icon" src="/assets/libang-icon.png" alt="L.B 아이콘" />
      <span>L.B ONLINE</span>
    </a>
    <h1 class="auth-title">계정</h1>
    <p class="subtitle">관리자 계정으로 로그인하면 사이트 내용을 바로 수정할 수 있습니다.</p>

    <div id="profileBox" class="profile" style="display:none;"></div>

    <div class="tabs">
      <div class="tab active" id="tabLogin">로그인</div>
      <div class="tab" id="tabSignup">회원가입</div>
    </div>

    <form id="loginForm">
      <div class="field">
        <label>이메일</label>
        <input type="email" name="email" required />
      </div>
      <div class="field">
        <label>비밀번호</label>
        <input type="password" name="password" required />
      </div>
      <div class="actions">
        <button class="btn primary" type="submit">로그인</button>
        <a class="btn" href="/api/auth/google/start"><i class="fa-brands fa-google"></i> Google</a>
      </div>
      <div class="message" id="loginMsg"></div>
    </form>

    <form id="signupForm" style="display:none;">
      <div class="field">
        <label>이름</label>
        <input type="text" name="name" />
      </div>
      <div class="field">
        <label>이메일</label>
        <input type="email" name="email" required />
      </div>
      <div class="field">
        <label>비밀번호</label>
        <input type="password" name="password" required />
      </div>
      <div class="actions">
        <button class="btn primary" type="submit">회원가입</button>
        <a class="btn" href="/api/auth/google/start"><i class="fa-brands fa-google"></i> Google</a>
      </div>
      <div class="message" id="signupMsg"></div>
    </form>

    <div class="actions">
      <a class="btn" href="/"><i class="fa-solid fa-arrow-left"></i>메인으로</a>
      <button class="btn" id="logoutBtn" type="button" style="display:none;">로그아웃</button>
    </div>
  </main>

  <script>
    const tabLogin = document.getElementById("tabLogin");
    const tabSignup = document.getElementById("tabSignup");
    const loginForm = document.getElementById("loginForm");
    const signupForm = document.getElementById("signupForm");
    const loginMsg = document.getElementById("loginMsg");
    const signupMsg = document.getElementById("signupMsg");
    const logoutBtn = document.getElementById("logoutBtn");
    const profileBox = document.getElementById("profileBox");

    function showTab(tab) {
      const login = tab === "login";
      tabLogin.classList.toggle("active", login);
      tabSignup.classList.toggle("active", !login);
      loginForm.style.display = login ? "" : "none";
      signupForm.style.display = login ? "none" : "";
      loginMsg.textContent = "";
      signupMsg.textContent = "";
    }

    tabLogin.addEventListener("click", () => showTab("login"));
    tabSignup.addEventListener("click", () => showTab("signup"));

    async function fetchMe() {
      try {
        const res = await fetch("/api/auth/me", { cache: "no-store" });
        if (!res.ok) throw new Error();
        const me = await res.json();
        profileBox.style.display = "block";
        profileBox.innerHTML = `
          <strong>${me.name || "사용자"}</strong><br />
          <span style="color:#697281">${me.email}</span><br />
          <span style="color:${me.role === "admin" ? "#0879d7" : "#697281"}">${me.role === "admin" ? "관리자 계정" : "일반 계정"}</span>
        `;
        logoutBtn.style.display = "inline-flex";
        tabLogin.style.display = "none";
        tabSignup.style.display = "none";
        loginForm.style.display = "none";
        signupForm.style.display = "none";
      } catch {
        profileBox.style.display = "none";
        logoutBtn.style.display = "none";
        tabLogin.style.display = "";
        tabSignup.style.display = "";
        showTab("login");
      }
    }

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      loginMsg.textContent = "";
      const body = Object.fromEntries(new FormData(loginForm).entries());
      const res = await fetch("/api/auth/login", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify(body)
      });
      if (res.ok) {
        loginMsg.textContent = "로그인 성공! 메인으로 이동합니다.";
        loginMsg.className = "message success";
        setTimeout(() => (window.location.href = "/"), 600);
      } else {
        const data = await res.json().catch(() => ({}));
        loginMsg.textContent = data.error || "로그인 실패";
        loginMsg.className = "message error";
      }
    });

    signupForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      signupMsg.textContent = "";
      const body = Object.fromEntries(new FormData(signupForm).entries());
      const res = await fetch("/api/auth/signup", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify(body)
      });
      if (res.ok) {
        signupMsg.textContent = "회원가입 완료! 메인으로 이동합니다.";
        signupMsg.className = "message success";
        setTimeout(() => (window.location.href = "/"), 600);
      } else {
        const data = await res.json().catch(() => ({}));
        signupMsg.textContent = data.error || "회원가입 실패";
        signupMsg.className = "message error";
      }
    });

    logoutBtn.addEventListener("click", async () => {
      await fetch("/api/auth/logout", { method: "POST" });
      window.location.reload();
    });

    fetchMe();
  </script>
</body>
</html>
